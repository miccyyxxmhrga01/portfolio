<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mic Dahryl Caybin | Web & Mobile Developer</title>
    <!-- Shown by Google and when your link is shared. Change it to describe you. -->
    <meta name="description" content="Mic Dahryl Caybin, a web and mobile developer from Tagbilaran City, Philippines, building websites and apps for small businesses and startups." />
    <meta property="og:title" content="Mic Dahryl Caybin | Web & Mobile Developer" />
    <meta property="og:description" content="Mic Dahryl Caybin, a web and mobile developer from Tagbilaran City, Philippines, building websites and apps for small businesses and startups." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />
    <!-- Tab icon: a small round crop of public/my-photo.png. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <!-- Applies the light/dark choice from the sidebar before the page shows, so it doesn't flash. -->
    <script>
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
